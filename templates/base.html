<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellhaven CRM Review</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f6f3; color: #222; }
  header { background: #2E5D50; color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
  header a { color: #fff; text-decoration: none; }
  header b { font-size: 18px; }
  main { max-width: 1150px; margin: 0 auto; padding: 20px; }
  h2 { color: #2E5D50; border-bottom: 2px solid #ddd; padding-bottom: 4px; margin-top: 32px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 14px 18px; margin: 12px 0; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { color: #666; font-weight: 600; width: 32%; }
  .diff { background: #fff3cd; }
  ul { margin: 6px 0; padding-left: 20px; font-size: 13px; }
  pre { background: #f3f3f3; padding: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button { padding: 6px 16px; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .approve { background: #2E7D32; color: #fff; } .reject { background: #b23b3b; color: #fff; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 3px; background: #eee; }
  .failed { background: #f8d7da; } .approved { background: #d4edda; } .rejected { background: #e2e3e5; }
  .note { color: #8a6d00; font-size: 13px; }
  .tabs a { margin-right: 14px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><b>Bellhaven CRM Review</b><a href="/">Queue</a><a href="/log">API log</a>
  <form method="post" action="/sync" style="margin-left:auto"><button>Re-run sync</button></form></header>
<main>
{% for m in get_flashed_messages() %}<div class="card note">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}</main>
</body>
</html>
